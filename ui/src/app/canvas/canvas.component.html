<div class="canvas-viewport">
    <div class="playback-speed-control" style="display: flex; align-items: center; margin-top: 16px;">
        <mat-slider
            min="0.5"
            max="2"
            step="0.1"
            [(ngModel)]="playbackSpeed"
            style="width: 200px;"
        ></mat-slider>
        <span style="margin-left: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px;">
            {{ playbackSpeed }}x
        </span>
    </div>
    <div class="canvas-container" [style.transform]="'translate(' + offsetX + 'px, ' + offsetY + 'px)'" #canvasContainer>
        <canvas #canvas>
        </canvas>
    </div>
</div>
