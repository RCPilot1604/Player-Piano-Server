<main>
  <mat-toolbar-row class="header">
    <span class="logo">
      <mat-icon id="piano-icon">piano</mat-icon>
      <h2 id="name">Player Piano Control Webapp</h2>
    </span>
    <button mat-icon-button [matMenuTriggerFor]="menu" id="side-menu" aria-label="Options">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="openAddSongDialog()">
        <mat-icon>library_music</mat-icon>
        <span>Add New Song</span>
      </button>
      <button mat-menu-item (click)="openAddCategoryDialog()">
        <mat-icon>category</mat-icon>
        <span>Add New Category</span>
      </button>
    </mat-menu>
  </mat-toolbar-row>
  <app-song-list [currentTime]="currentTime"></app-song-list>
  <div class="playback-speed-control">
    <mat-slider
        class="playback-slider"
        [disabled]="false"
        [max]="2"
        [min]="0.5"
        [step]="0.1"
        [discrete]="false"
        [showTickMarks]="true">
      <input matSliderThumb [(ngModel)]="playbackMultiplier" #slider>
    </mat-slider>
    <span style="margin-left: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px;">
      {{ slider.value }}x
    </span>
  </div>
  <tile-canvas [currentTime]="currentTime" [MidiData]="midiData" [TileData]="tileData" [playbackMultiplier]="playbackMultiplier"></tile-canvas>
  <router-outlet />
</main>
